<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RunMate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* 對照組：一句「幫我設計一個跑步 App」直接生出來的樣子 */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Inter, -apple-system, sans-serif; background: #f5f6fb; color: #1e1b3a; padding: 62px 20px 110px; position: relative; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
  .hi { font-size: 14px; color: #8b8aa6; }
  .name { font-size: 22px; font-weight: 700; margin-top: 2px; }
  .avatar { width: 44px; height: 44px; border-radius: 16px; background: linear-gradient(135deg, #a78bfa, #6366f1); box-shadow: 0 8px 24px rgba(99,102,241,.25); }
  .hero { border-radius: 24px; padding: 24px; color: #fff; background: linear-gradient(135deg, #7c3aed 0%, #6366f1 50%, #3b82f6 100%); box-shadow: 0 20px 40px rgba(99,102,241,.35); text-align: center; position: relative; overflow: hidden; }
  .hero::after { content: ""; position: absolute; width: 180px; height: 180px; border-radius: 50%; background: rgba(255,255,255,.12); top: -60px; right: -50px; }
  .hero small { opacity: .8; font-size: 13px; }
  .hero h2 { font-size: 36px; font-weight: 700; margin: 6px 0 14px; }
  .pill { display: inline-block; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.2); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-size: 12px; font-weight: 600; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 20px 0; }
  .card { background: #fff; border-radius: 20px; padding: 16px 12px; box-shadow: 0 8px 24px rgba(30,27,58,.06); text-align: center; }
  .card .e { font-size: 24px; }
  .card b { display: block; font-size: 16px; margin-top: 6px; }
  .card span { font-size: 12px; color: #8b8aa6; }
  .ai { display: flex; align-items: center; gap: 12px; border-radius: 20px; padding: 16px; margin-bottom: 20px; background: linear-gradient(90deg, #ede9fe, #e0e7ff); box-shadow: 0 8px 24px rgba(30,27,58,.06); }
  .ai p { font-size: 13px; color: #4c3fa8; line-height: 1.5; }
  .ai .badge { flex: none; padding: 6px 10px; border-radius: 999px; background: #fff; font-size: 12px; font-weight: 600; color: #7c3aed; }
  h3 { font-size: 17px; font-weight: 700; margin-bottom: 12px; display: flex; justify-content: space-between; }
  h3 a { font-size: 13px; color: #7c3aed; text-decoration: none; font-weight: 500; }
  .row { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 20px; padding: 14px; margin-bottom: 10px; box-shadow: 0 8px 24px rgba(30,27,58,.06); }
  .row .e { width: 44px; height: 44px; border-radius: 14px; background: #f3f0ff; display: grid; place-items: center; font-size: 20px; }
  .row div { flex: 1; } .row b { font-size: 15px; font-weight: 600; } .row small { display: block; font-size: 12px; color: #8b8aa6; margin-top: 2px; }
  .row i { font-style: normal; font-weight: 700; }
  .tab { position: fixed; left: 16px; right: 16px; bottom: 24px; height: 68px; border-radius: 24px; background: rgba(255,255,255,.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 10px 30px rgba(30,27,58,.12); display: flex; justify-content: space-around; align-items: center; font-size: 22px; }
  .fab { width: 52px; height: 52px; border-radius: 18px; background: linear-gradient(135deg, #7c3aed, #3b82f6); color: #fff; display: grid; place-items: center; font-size: 28px; box-shadow: 0 10px 24px rgba(124,58,237,.4); }
</style>
</head>
<body>
<script src="ios.js" defer></script>
  <div class="top">
    <div><p class="hi">Welcome back 👋</p><p class="name">歡迎回來，Mira</p></div>
    <div class="avatar"></div>
  </div>
  <section class="hero" id="hero">
    <small>本週跑量</small>
    <h2>18.4 km</h2>
    <span class="pill">✨ 比上週多 12%</span>
  </section>
  <div class="stats" id="stats">
    <div class="card"><div class="e">🏃</div><b>23 天</b><span>連續</span></div>
    <div class="card"><div class="e">⚡</div><b>6'14"</b><span>配速</span></div>
    <div class="card"><div class="e">🔥</div><b>1,240</b><span>大卡</span></div>
  </div>
  <div class="ai" id="ai"><span class="badge">🤖 AI 教練</span><p>輕鬆養成跑步習慣，讓運動更簡單！</p></div>
  <h3>最近跑步 <a href="#">查看全部</a></h3>
  <div class="row"><span class="e">🌅</span><div><b>晨跑</b><small>今天 06:40</small></div><i>5.0 km</i></div>
  <div class="row"><span class="e">🌙</span><div><b>夜跑</b><small>昨天 21:10</small></div><i>4.2 km</i></div>
  <div class="row"><span class="e">🏞️</span><div><b>河濱長跑</b><small>10/05</small></div><i>9.2 km</i></div>
  <div class="row"><span class="e">⏱️</span><div><b>間歇跑</b><small>10/04</small></div><i>3.0 km</i></div>
  <nav class="tab"><span>🏠</span><span>📅</span><span class="fab">▶</span><span>📈</span><span>👤</span></nav>
</body>
</html>
